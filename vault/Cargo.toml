[package]
name = "cmdk-vault"
description = "cmdk vault on NEAR, hackathon build: owner messages, policy, agent key, attestation, Base transactions via Chain Signatures."
version = "0.1.0"
edition = "2021"
# NEP-330: cargo-near writes this link into the wasm (`contract_source_metadata`). Public from the submission.
repository = "https://github.com/cmdkfi/app"

[lib]
crate-type = ["cdylib", "rlib"]

# `cargo near build reproducible-wasm` (decided 3 Nov for Friday's publish). As generated by `cargo near new` with
# cargo-near 0.22.0. The image is identified by its digest; the tag is descriptive only.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
# `ecrecover` is behind the `unstable` feature in near-sdk 5.29.1 (measurement G).
near-sdk = { version = "5.29.1", features = ["unstable"] }
# Same verifier build as measurement F.
dcap-qvl = { version = "0.7.0", default-features = false, features = ["contract", "std", "default-x509", "rustcrypto"] }
omni-transaction = { version = "0.5.0", default-features = false, features = ["evm"] }
hex = "0.4"
sha2 = "0.10"
# omni-transaction encodes but does not decode; the decode-back uses the same rlp crate it encodes with.
rlp = "0.6.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
codegen-units = 1
opt-level = 3
lto = true
debug = false
panic = "abort"
overflow-checks = true

[dev-dependencies]
near-sdk = { version = "5.29.1", features = ["unstable", "unit-testing"] }
near-workspaces = "0.23.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
# Factory test only: publish the vault as a Global Contract with a raw signed transaction (near-workspaces 0.23
# has no API for it; research H). Same versions as near-workspaces already pulls in.
near-primitives = "0.37.4"
near-crypto = "0.37.4"
near-jsonrpc-client = "0.22.0"
