[package]
name = "cmdk-factory"
description = "cmdk vault factory on NEAR, hackathon build: keyless, immutable, creates each vault as a sub-account that uses the vault Global Contract by code hash, with the Base address the signer derives for it."
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29.1"
hex = "0.4"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
