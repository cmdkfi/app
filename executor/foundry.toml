[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]

[fuzz]
runs = 256

[rpc_endpoints]
base_sepolia = "https://base-sepolia-rpc.publicnode.com"

[lint]
lint_on_build = false
