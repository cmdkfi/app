# Measured: dstack hashes Phala's app-compose.json, which embeds this file byte for byte, the pre-launch script
# (pre-launch.sh, passed with --pre-launch-script) and allowed_envs (NEARAI_API_KEY only). Every behaviour flag is
# here, on the command line; the encrypted environment carries only the NEAR AI key. Deploy and verify:
# MEASUREMENT.md. The image digest is the registry (manifest) digest recorded after the push (MEASUREMENT.md §2).
services:
  agent:
    image: ghcr.io/cmdkfi/agent@sha256:5440598059c9f971c4d23e8198b4b094bc7aceaa1767006d7db5a11890c4bf11
    command: ["--mode", "live", "--operator", "cmdk", "--factory", "factory.prime-measure-1792736012.testnet"]
    environment:
      - NEARAI_API_KEY=${NEARAI_API_KEY}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - evidence:/evidence
    ports:
      - "8080:8080"
    restart: unless-stopped
volumes:
  evidence:
